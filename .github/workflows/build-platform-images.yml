name: Platform container images

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/platform-images/**'
      - 'deploy/scripts/verify-platform-images.sh'
      - '.github/workflows/build-platform-images.yml'
  pull_request:
    paths:
      - 'deploy/platform-images/**'
      - 'deploy/scripts/verify-platform-images.sh'
      - '.github/workflows/build-platform-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kind: mgmt-server
            context: deploy/platform-images/mgmt-server
            dockerfile: deploy/platform-images/mgmt-server/Dockerfile
          - kind: browser
            context: deploy/platform-images
            dockerfile: deploy/platform-images/browser/Dockerfile
          - kind: desktop
            context: deploy/platform-images
            dockerfile: deploy/platform-images/desktop/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.kind }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nova-ve-${{ matrix.kind }}:latest
            ghcr.io/${{ github.repository_owner }}/nova-ve-${{ matrix.kind }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Nova VE ${{ matrix.kind }} platform container

      - name: Boot and verify ${{ matrix.kind }}
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nova-ve-${{ matrix.kind }}:latest
        run: |
          docker run -d --name platform-image "$IMAGE"
          trap 'docker logs platform-image; docker rm -f platform-image' EXIT
          for _ in {1..15}; do
            if deploy/scripts/verify-platform-images.sh "$KIND" platform-image; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nova-ve-${{ matrix.kind }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
