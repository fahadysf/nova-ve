# US-071: Run the router benchmarks and report measured #74 tripwire violations.
# The 500-node benchmark also gates CI. Issue #74 specifies the 200-node
# performance and quality limits, plus the router line count.
name: router-tripwires
on:
  pull_request:
    paths:
      - '.github/workflows/router-tripwires.yml'
      - 'frontend/src/lib/services/router/orthogonal.ts'
      - 'frontend/tests/e2e/bench/router_*.spec.ts'
      - 'frontend/tests/e2e/bench/routerTripwire.ts'
      - 'frontend/tests/e2e/fixtures/router_bench_*.json'

permissions:
  contents: read

jobs:
  tripwires:
    runs-on: ubuntu-latest
    outputs:
      exceeded: ${{ steps.perf.outputs.exceeded == 'true' || steps.quality.outputs.exceeded == 'true' || steps.size.outputs.exceeded == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and generate Svelte config
        id: install
        run: |
          npm install
          npx svelte-kit sync
      - name: Router perf bench
        id: perf
        run: ROUTER_TRIPWIRE_OUTPUT="$GITHUB_OUTPUT" npm run test -- tests/e2e/bench/router_perf.spec.ts
      - name: Router quality bench
        id: quality
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ROUTER_TRIPWIRE_OUTPUT="$GITHUB_OUTPUT" npm run test -- tests/e2e/bench/router_quality.spec.ts
      - name: LOC guard
        id: size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          loc=$(wc -l < src/lib/services/router/orthogonal.ts)
          echo "orthogonal.ts LOC: $loc"
          if (( loc > 1500 )); then
            echo 'exceeded=true' >> "$GITHUB_OUTPUT"
            exit 1
          fi

  promote-on-measurement:
    needs: tripwires
    if: ${{ !cancelled() && needs.tripwires.outputs.exceeded == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Promote open tracker issue #74
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eligible=$(gh issue view 74 --json state,labels --jq '.state == "OPEN" and any(.labels[]; .name == "blocked-on-measurement")')
          if [[ "$eligible" == true ]]; then
            gh issue edit 74 --remove-label blocked-on-measurement --add-label active
          fi
