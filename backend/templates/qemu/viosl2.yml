type: qemu
name: Cisco IOSvL2
description: Cisco IOSvL2
icon_type: switch
cpu: 1
ram: 1024
ethernet: 8
console_type: telnet
qemu_options: -machine type=pc,accel=kvm -no-user-config -nodefaults -rtc base=utc -cpu host
capabilities:
  machine: pc
  hotplug: false
  max_nics: 8
interface_naming:
  format:
  - Gi0/0
  - Gi0/1
  - Gi0/2
  - Gi0/3
  - Gi1/0
  - Gi1/1
  - Gi1/2
  - Gi1/3
  - Gi{port}
