type: qemu
name: vyos
image_aliases:
  - "vyos-*"
description: VyOS router. Boots from cdrom.iso; run `install image` once on first launch.
cpulimit: 1
icon_type: router
cpu: 1
ram: 1024
ethernet: 4
console_type: telnet
architecture: x86_64
qemu_nic: virtio-net-pci
capabilities:
  hotplug: true
  max_nics: 8
  machine: q35
interface_naming:
  format: "eth{n}"
