type: docker
name: Browser
description: >-
  Firefox station for lab web UIs with a compact Openbox desktop, taskbar,
  and Nova VE wallpaper. VNC is the default console, with resizable RDP
  available as a console type and telnet available for a shell.
  Requires nova-ve/browser:latest.
cpulimit: 1
icon_type: server
cpu: 1
ram: 1024
ethernet: 1
console_type: vnc
second_console: telnet
image: nova-ve/browser:latest
extras:
  mgmt_access: "true"
