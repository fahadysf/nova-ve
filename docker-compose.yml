services:
  db-init:
    image: alpine:3.21
    restart: "no"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - labdata:/data
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f /data/db_password ]; then
          echo "Generating random database password..."
          umask 077
          if [ -n "$${DB_PASSWORD:-}" ]; then
            printf '%s\n' "$${DB_PASSWORD}" > /data/db_password
          else
            tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /data/db_password
          fi
          chmod 600 /data/db_password
          echo "Done."
        else
          echo "Database password already exists."
        fi
        # Instance ID for bridge/TAP name derivation (host_net.get_instance_id).
        # Same kernel-UUID format as provision-ubuntu-2604.sh ensure_instance_id.
        if [ ! -s /data/instance_id ]; then
          cat /proc/sys/kernel/random/uuid > /data/instance_id
          echo "Generated instance ID: $$(cat /data/instance_id)"
        else
          echo "Instance ID already exists: $$(cat /data/instance_id)"
        fi

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nova}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-novadb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - labdata:/run/secrets:ro
    ports:
      # Bind address + host ports are overridable so the sandbox can coexist
      # with other local listeners (e.g. an SSH tunnel forwarding a deployed
      # instance). Loopback-only by default; on Linux hosts NOVA_VE_SANDBOX_BIND
      # can be e.g. 127.0.0.2 to share port numbers with a 127.0.0.1 service.
      - "${NOVA_VE_SANDBOX_BIND:-127.0.0.1}:${NOVA_VE_SANDBOX_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nova} -d ${DB_NAME:-novadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db-init:
        condition: service_completed_successfully

  # One-shot: create dummy node images (qemu/iol/dynamips) in the volume so
  # the add-node modal and node creation work without real images (#253).
  # Idempotent — never touches pre-existing files, so real images deployed
  # into the volume later are safe.
  sandbox-images:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      BASE_DATA_DIR: /data
      IMAGES_DIR: /data/images
      TEMPLATES_DIR: /app/templates
    volumes:
      - labdata:/data
    command: python -m scripts.sandbox_images

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-nova}
      DB_NAME: ${DB_NAME:-novadb}
      # DATABASE_URL is auto-constructed from /data/db_password + the DB_* vars above.
      # Set DATABASE_URL explicitly to override: postgresql+asyncpg://user:pass@host:5432/db
      BASE_DATA_DIR: /data
      LABS_DIR: /data/labs
      IMAGES_DIR: /data/images
      TMP_DIR: /data/tmp
      # Provisioned by db-init into the shared volume; without this the
      # backend exits at startup (host_net.get_instance_id).
      NOVA_VE_INSTANCE_ID_FILE: /data/instance_id
      # UI sandbox (#253): host network ops become logged no-ops, node
      # start returns a typed sandbox error, docker catalog is synthetic.
      NOVA_VE_SANDBOX_MODE: "1"
    volumes:
      # Labs/images/tmp persist in the volume — deliberately NOT bind-mounted
      # from the repo so UI edits never dirty the working tree.
      - labdata:/data
    ports:
      - "${NOVA_VE_SANDBOX_BIND:-127.0.0.1}:${NOVA_VE_SANDBOX_BACKEND_PORT:-8000}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      sandbox-images:
        condition: service_completed_successfully
    # UI-sandbox bootstrap: schema + bootstrap admin (idempotent; generated
    # password is printed to logs unless NOVA_VE_ADMIN_PASSWORD is set), then
    # the API. Node start/stop and consoles are expected to fail here — no
    # QEMU/Docker socket and no Guacamole in this stack (#252).
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NOVA_VE_SANDBOX_BIND:-127.0.0.1}:${NOVA_VE_SANDBOX_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Vite proxies /api + /VERSION to the backend service, not localhost.
      - NOVA_VE_BACKEND_ORIGIN=http://backend:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  labdata:
